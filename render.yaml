services:
  - type: web
    name: meetflow-backend
    runtime: node
    plan: free
    nodeVersion: 22.14.0
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node server/index.js
    healthCheckPath: /api/voice/health
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SERVER_BASE_URL
        fromService:
          type: web
          name: meetflow-backend
          property: url
      - key: SIGNED_URL_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FALLBACK_TO_MOCK
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false