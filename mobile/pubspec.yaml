name: meetflow
description: Real-time meeting and collaboration platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_functions: ^5.0.0

  # LiveKit
  livekit_client: ^2.0.0

  # State management
  provider: ^6.1.0
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Permissions
  permission_handler: ^11.3.0

  # Audio recording
  record: ^5.1.0

  # UI
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.0
  path: ^1.9.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
